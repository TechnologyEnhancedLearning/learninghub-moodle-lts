apiVersion: v1
kind: PersistentVolume
metadata:
  annotations:
    pv.kubernetes.io/provisioned-by: file.csi.azure.com
  name: moodlerestuploads
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: azurefile-csi
  csi:
    driver: file.csi.azure.com
    volumeHandle: "moodleCluster#premiumlhmoodledev#moodlerestuploads"
    volumeAttributes:
      protocol: nfs
      shareName: moodlerestuploads
      server: premiumlhmoodledev.privatelink.file.core.windows.net
  mountOptions:
    - nconnect=4
