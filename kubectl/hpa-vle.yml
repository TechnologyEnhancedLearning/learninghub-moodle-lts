apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hpa-vle
  namespace: learninghubmoodle
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: learninghubmoodlevle
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
