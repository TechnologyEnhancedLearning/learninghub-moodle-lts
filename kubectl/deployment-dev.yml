apiVersion: apps/v1
kind: Deployment
metadata:
  name: learninghubmoodledev
  namespace: learninghubmoodle
spec:
  replicas: 2
  selector:
    matchLabels:
      app: learninghubmoodledev
  template:
    metadata:
      labels:
        app: learninghubmoodledev
    spec:
      containers:
      - name: learninghubmoodleimage
        image: learninghubmoodlecrdev.azurecr.io/learninghubmoodleimage:latest
        imagePullPolicy: Always
        resources:
          requests:
            cpu: "1000m"
            memory: "2Gi"
          limits:
            memory: "4Gi"
        ports:
        - containerPort: 80
        volumeMounts:
        - name: moodledata
          mountPath: /var/www/moodledata
          readOnly: false
        - name: moodlerestuploads
          mountPath: /var/www/html/webservice/rest/uploads
        - name: localcache
          mountPath: /tmp/moodlelocalcache
      volumes:
      - name: moodledata
        persistentVolumeClaim:
          claimName: moodledataclaim
      - name: moodlerestuploads
        persistentVolumeClaim:
          claimName: moodleuploadsclaim
      - name: localcache
        emptyDir:
          sizeLimit: 1Gi