apiVersion: v1
kind: PersistentVolume
metadata:
  annotations:
    pv.kubernetes.io/provisioned-by: file.csi.azure.com
  name: moodlerestuploads
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: azurefile-csi
  csi:
    driver: file.csi.azure.com
    volumeHandle: "moodleCluster#premiumlhmoodleprod#moodlerestuploads"  
    volumeAttributes:
      protocol: nfs
      shareName: moodlerestuploads
      server: premiumlhmoodleprod.privatelink.file.core.windows.net # Ensure Private Endpoint DNS exists for this!
  mountOptions:
    - nconnect=4