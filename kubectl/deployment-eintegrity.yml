apiVersion: apps/v1
kind: Deployment
metadata:
  name: learninghubmoodleeintegrity
  namespace: learninghubmoodle
spec:
  replicas: 2
  selector:
    matchLabels:
      app: learninghubmoodleeintegrity
  template:
    metadata:
      labels:
        app: learninghubmoodleeintegrity
    spec:
      containers:
      - name: learninghubmoodleimage
        image: learninghubmoodlecreintegrity.azurecr.io/learninghubmoodleimage:latest
        imagePullPolicy: Always
        resources:
          requests:
            cpu: 500m
            memory: 4Gi
          limits:
            cpu: 1
            memory: 8Gi
        ports:
        - containerPort: 80
        volumeMounts:
        - name: moodledata
          mountPath: /var/www/moodledata
          readOnly: false
        - name: moodletheme
          mountPath: /var/www/html/theme
      volumes:
      - name: moodledata
        azureFile:
          secretName: azure-secret
          shareName: moodledata
          readOnly: false
          mountOptions:
            - dir_mode=0777
            - file_mode=0777
            - mfsymlinks
            - nobrl
      - name: moodletheme
        persistentVolumeClaim:
          claimName: moodlethemeclaim