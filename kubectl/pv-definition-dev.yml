apiVersion: v1
kind: PersistentVolume
metadata:
  annotations:
    pv.kubernetes.io/provisioned-by: file.csi.azure.com
  name: moodledata
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: azurefile-csi
  csi:
    driver: file.csi.azure.com
    volumeHandle: "moodleCluster#premiumlhmoodledev#moodledata"  # Updated handle to force fresh CSI tracking
    volumeAttributes:
      protocol: nfs                                              # Required for NFS shares
      shareName: moodledata
      server: premiumlhmoodledev.privatelink.file.core.windows.net # Ensure Private Endpoint DNS exists for this!
    # nodeStageSecretRef removed: NFS uses VNet/Private Endpoint security, not storage account keys
  mountOptions:
    - nconnect=4                                                 # Replaces all SMB-only mountOptions
